# Dawg Viewer settings.
# Edit freely with any text editor; the app reads this file when it starts.
# Paths can be absolute or relative to this folder.

# Device profile to connect to on start: the "id" of a file in devices/.
device: g26-iltm

# Live view refresh rate, in frames per second.
frame_rate: 20

# How many minutes of live data to keep in memory for plots.
history_minutes: 30

# A channel with no new value for this many seconds is shown as stale.
stale_after_s: 2

# Folder where downloaded and converted logs are saved.
logs_dir: logs

# Samples per second of the evenly spaced CSV made from each downloaded log,
# and of .bin logs opened in the Viewer.
csv_rate_hz: 100

# While connected, also save everything received live to a CSV in logs_dir
# (<date>_<time>_live_<device>.csv, UTC), as a backup of the session. Open it
# from the Logs tab like a downloaded log. Set to false to turn it off, or use
# the Backup log checkbox in the Live tab.
live_backup: true

# Map backgrounds for the track maps (off until someone picks one in the app).
# Two are built in: "satellite" (USGS aerial photos, United States only) and
# "streets" (OpenStreetMap). Imagery is downloaded the first time a place is
# shown and kept in the maps/ folder next to this file, so it still works with
# no internet at the track. To add another tile server (or replace a built-in
# one by reusing its id), list it here. The url needs {z}, {x} and {y}, or
# {bbox} for servers that take a Web Mercator bounding box:
#
# map_sources:
#   - id: team-imagery
#     name: Team imagery
#     url: https://tiles.example.com/{z}/{x}/{y}.jpg
#     max_zoom: 19
#     attribution: Imagery © Example

# Track outlines for the simulator (Sim tab, Lap page). Nothing is sent until
# someone presses a search button there. "Search around the open log" asks an
# OpenStreetMap Overpass server for the race tracks mapped near the log.
# Searching by name also needs a geocoder and stays off until this block is
# uncommented: the public Nominatim server has a usage policy to read and agree
# to first (https://operations.osmfoundation.org/policies/nominatim/). See
# docs/configuration.md, "Track search". Set "overpass: []" to turn every
# online track lookup off.
#
# track_search:
#   geocoder: https://nominatim.openstreetmap.org/search
#   overpass:
#     - https://overpass-api.de/api/interpreter
#     - https://overpass.private.coffee/api/interpreter
