name: Set up toolchain
description: Go, Node.js, the Wails CLI, Linux GUI libraries and frontend packages.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    - shell: bash
      run: |
        version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"

    - shell: bash
      run: npm ci --prefix frontend
